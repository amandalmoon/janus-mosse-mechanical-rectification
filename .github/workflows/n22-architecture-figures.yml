name: N22 Architecture-Aligned Figure Gate

on:
  pull_request:
    paths:
      - "figures/publication/n22/**"
      - "research-os/janus_n8_gate/**"
      - "reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2/**"
      - ".github/workflows/n22-architecture-figures.yml"
  workflow_dispatch:

jobs:
  render-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2/requirements.txt

      - name: Install figure environment
        shell: pwsh
        run: |
          python -m pip install -r reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2/requirements.txt
          python -m pip install pymupdf pillow

      - name: Verify literal Arial is available
        shell: pwsh
        run: python -c "from matplotlib import font_manager; print(font_manager.findfont('Arial', fallback_to_default=False))"

      - name: Validate N22 manifest contract
        shell: pwsh
        run: python figures/publication/n22/source/verify_n22_manifests.py

      - name: Render architecture-aligned figures
        shell: pwsh
        run: |
          $env:PYTHONPATH = "figures/publication/n22/source"
          python figures/publication/n22/source/make_all_n22.py `
            --release-root reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2 `
            --extra-data research-os/janus_n8_gate `
            --out figures/publication/n22/figures `
            --font-family Arial

      - name: Verify literal Arial, physical size, exports, and checksums
        shell: pwsh
        run: python figures/publication/n22/source/verify_n22_outputs.py figures/publication/n22/figures --require-arial

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q figures/publication/n22/source

      - name: Upload N22 preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: Janus_MoSSe_N22_Architecture_Aligned_Figures_Arial
          path: |
            figures/publication/n22/figures/*.pdf
            figures/publication/n22/figures/*.svg
            figures/publication/n22/figures/*.eps
            figures/publication/n22/figures/*.png
            figures/publication/n22/figures/N22_FIGURE_SHA256SUMS.txt
            figures/publication/n22/manifests/*.json
            figures/publication/n22/FIGURE_CONTRACT_MASTER_SPEC.md
            figures/publication/n22/qa/*.md
            figures/publication/n22/qa/*.json
          if-no-files-found: error
          retention-days: 90
