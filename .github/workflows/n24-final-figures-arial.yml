name: N24 Final N22R Arial Figure Gate

on:
  pull_request:
    paths:
      - "figures/publication/n22r/**"
      - "reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2/**"
      - "research-os/janus_n8_gate/**"
      - ".github/workflows/n24-final-figures-arial.yml"
  workflow_dispatch:

jobs:
  render-final-arial:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2/requirements.txt

      - name: Install figure environment
        shell: pwsh
        run: |
          python -m pip install -r reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2/requirements.txt
          python -m pip install pymupdf pillow

      - name: Restore frozen N22R figure sources
        shell: pwsh
        run: |
          $b64 = Get-Content figures/publication/n22r/ci/n22r_sources.b64 -Raw
          [IO.File]::WriteAllBytes("n22r_sources.tar.gz", [Convert]::FromBase64String($b64.Trim()))
          python -c "import tarfile; tarfile.open('n22r_sources.tar.gz','r:gz').extractall('.')"

      - name: Verify literal Arial is available
        shell: pwsh
        run: python -c "from matplotlib import font_manager; print(font_manager.findfont('Arial', fallback_to_default=False))"

      - name: Render final N22R figure set in literal Arial
        shell: pwsh
        run: |
          python figures/publication/n22r/source/make_all_n22r.py `
            --release-root reproducibility/Janus_MoSSe_Current_ReproducibilityRelease_v2 `
            --extra-data research-os/janus_n8_gate `
            --out figures/publication/n22r/figures `
            --font-family Arial

      - name: Verify Arial, physical sizes, exports, and raster dimensions
        shell: pwsh
        run: python figures/publication/n22r/source/verify_n22r_outputs.py figures/publication/n22r/figures --require-arial

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q figures/publication/n22r/source

      - name: Upload final Arial figure set
        uses: actions/upload-artifact@v4
        with:
          name: Janus_MoSSe_N22R_Final_Arial_Figures
          path: |
            figures/publication/n22r/figures/*.pdf
            figures/publication/n22r/figures/*.svg
            figures/publication/n22r/figures/*.eps
            figures/publication/n22r/figures/*.png
            figures/publication/n22r/figures/N22R_FIGURE_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
